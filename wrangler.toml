# ==============================================================================
# Cloudflare Worker Configuration for MAA SHARADA ENTERPRISES
# Architecture: Cloudflare Worker with Static Assets + D1 SQLite Database
# ==============================================================================
name = "maa-sharda-pvt"
main = "worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 1. Static Assets Configuration (Cloudflare serves frontend files from ./public)
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 2. Cloudflare D1 Database Binding
# In Cloudflare, run: npx wrangler d1 create maa-sharda-db
# And update database_id with your real D1 database id
[[d1_databases]]
binding = "DB"
database_name = "maa-sharda-db"
database_id = "daa51131-2961-4861-8806-96f6dbe41a7e"

# 3. Default Public Environment Variables
[vars]
SHOP_PHONE_NUMBER = "+91 63868 50612"
SHOP_EMAIL = "contact@maasharada.com"
